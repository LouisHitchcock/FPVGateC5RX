; FPVGateC5RX firmware.
;
; Build and flash (from PowerShell on Windows, not Git Bash):
;   pio run -e waveshare_c5_zero -t upload --upload-port COM29
;
; The unit tests are separate and run on a PC: bash ../test/run.sh

[platformio]
src_dir = .
include_dir = include

[env]
; The ESP32-C5 needs the pioarduino platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-c5-devkitc-1
monitor_speed = 115200
build_src_filter = +<src/> +<core/>
build_flags =
    -I .
    -I include
    -std=gnu++14

; Waveshare ESP32-C5-Zero. Tested.
[env:waveshare_c5_zero]
build_flags =
    ${env.build_flags}
    -DPIN_RX5808_CLK=4 -DPIN_RX5808_DATA=5 -DPIN_RX5808_SEL=6 -DPIN_RSSI_SDM=10

; Any other ESP32-C5 board. Check the pins below are free on your board
; (see include/board_pins.h for the ones to avoid) and change them if not.
[env:esp32c5]
build_flags =
    ${env.build_flags}
    -DPIN_RX5808_CLK=4 -DPIN_RX5808_DATA=5 -DPIN_RX5808_SEL=6 -DPIN_RSSI_SDM=10
